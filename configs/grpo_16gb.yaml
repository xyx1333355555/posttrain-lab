# ===== 低显存方案：Kaggle T4(16GB) / Colab T4(16GB) =====
# 与 configs/grpo.yaml 的关键差异（面试时记得说清楚差别的原因）：
#   - torch_dtype: float16   （T4 是 Turing，无 bf16 原生支持）
#   - attn: sdpa             （flash-attn 在 T4 上不稳定）
#   - 模型降到 0.5B          （16GB 放不下 1.5B + vLLM colocate）
#   - 生成长度 384           （采样是显存大头）
#   - vLLM 显存占比 0.22     （给训练侧留够空间）
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
base_model_for_tokenizer: Qwen/Qwen2.5-0.5B-Instruct
torch_dtype: float16
attn_implementation: sdpa

seed: 42
output_dir: outputs/grpo_16gb

dataset:
  name: openai/gsm8k
  config: main
  split: train
  limit: 3000
  answer_parser: gsm8k_hash

grpo:
  num_generations: 8
  max_completion_length: 384
  max_prompt_length: 256
  temperature: 1.0
  top_p: 1.0
  learning_rate: 1.0e-6
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  scale_rewards: false
  loss_type: dr_grpo
  num_iterations: 1

train:
  mode: full
  # 16GB 下的务实选择：per_device_train_batch_size=8 -> 每条设备 batch 恰好 1 个 prompt
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 16   # 优化器每步 16 个 prompt，保证梯度质量
  num_train_epochs: 1
  optim: adamw_bnb_8bit
  bf16: false                        # T4 不支持 bf16，必须 false，走 fp16
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 60                     # 免费平台务必存勤密点
  save_total_limit: 3

vllm:
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.22
  vllm_tensor_parallel_size: 1
  vllm_enable_sleep_mode: true

rewards:
  weights:
    correctness: 1.0
    format: 0.2
    length: 0.05
  length_penalty:
    ref_tokens: 300
    mode: soft
